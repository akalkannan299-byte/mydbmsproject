spring.application.name=noirbite
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/noirbite_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.tax-rate=${TAX_RATE:0.05}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.admin-key=${ADMIN_API_KEY:}
# Gemini-powered concierge. Key comes from the GEMINI_API_KEY environment variable (never hard-code it).
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# Optional local overrides: backend/.env (KEY=value lines, git-ignored). Real environment variables win.
spring.config.import=optional:file:./.env[.properties]
